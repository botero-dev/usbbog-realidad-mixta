; PlatformIO project — brain (ESP32-S3-CAM)
; ---------------------------------------------------------------------------
; Board     : Freenove ESP32-S3-WROOM N16R8 carrier (2 x 20 headers), OV3660
; Framework : Arduino
; Purpose   : THE ESP32-S3 SIDE OF THE PROJECT. As of 2026-10-11 it holds the
;             camera AND the audio chain in one firmware — the merge of
;             firmware/cam-test back into brain, which is what actually tests
;             plan section 6's warning that the camera DMA and the I2S DMA share
;             the octal PSRAM bus.
;
;             Camera : OV3660 on the board's FPC connector, MJPEG stream over
;                      SoftAP. Verified on hardware in cam-test, then merged.
;             Audio  : I2S -> PCM5102A -> class-D amp -> speaker. SILENT until
;                      asked: the page has two buttons (beeps / sound file) and
;                      /play?src=beeps|clip. Nothing autoplays, on purpose.
;
;             It is meant to grow into the full "brain" of section 1 -- IMU and
;             the control loop are still to come -- and to absorb the mixing code
;             that currently sits in firmware/car_control (plan section 10.3).
;
; Sources   : src/main.cpp (camera + AP + boot), src/app_httpd.cpp (the web
;             server), src/audio_player.cpp (I2S + tone + clip playback),
;             src/audio_clip.cpp (generated samples). The camera bring-up now
;             lives here; firmware/cam-test/ is kept as the standalone
;             one-thing-at-a-time version.
;
; Authority : docs/circuit-plan.md sections 1, 2, 6 (audio), 10.1 (S3 firmware
;             notes), 11 (bring-up); docs/esp32-cam.md section 9 (build settings
;             for the N16R8 module).
;
; This is a STANDALONE project inside the repository, like network-test/ and
; firmware/pico_body/. The root platformio.ini belongs to firmware/car_control
; (a classic ESP32), so build this one explicitly:
;
;   pio run -d firmware/brain                 # build
;   pio run -d firmware/brain -t upload       # flash
;   pio run -d firmware/brain -t monitor      # USB CDC output
; ---------------------------------------------------------------------------

[platformio]
default_envs = s3cam

[env:s3cam]
platform = espressif32
; *** THIS BOARD, not esp32-s3-devkitc-1. ***
;
; `esp32-s3-devkitc-1` is literally named
;     "Espressif ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)"
; -- a board with no PSRAM -- while this module has 8 MB of IN-PACKAGE OCTAL
; (OPI) PSRAM. This Freenove def is the honest description of the hardware:
; `"psram_type": "opi"`, `memory_type = qio_opi`, `-DBOARD_HAS_PSRAM`.
;
; BE CLEAR ABOUT WHAT THIS DID **NOT** DO: switching to it changed neither the
; bootloader nor the boot loop. This comment previously asserted the module failed
; to boot "because PlatformIO flashed a bootloader built for a chip WITHOUT OPI
; PSRAM". That was a hypothesis, it has since been tested, and it is WRONG. Read
; the UNRESOLVED note at the bottom of this file before believing anything here.
board = freenove_esp32_s3_wroom
framework = arduino

; --- 16 MB flash: NOT enabled. This board boots at Freenove's 8 MB config. ----
; The board booted Freenove's stock firmware, so the hardware is good and the long
; boot loop was a BUILD problem, now solved.
;
; VERIFIED WORKING: this Freenove board def with NO flash-size override and NO
; partition override, i.e. their default_8MB.csv and 8 MB flash_size.
;
; VERIFIED NOT WORKING: `board_build.flash_size = 16MB` plus a 16 MB partition
; table -- tried with default_16MB.csv and with a hand-written partitions_16mb.csv,
; under both the esp32-s3-devkitc-1 and the Freenove board defs. Every one of them
; looped at ~33 boots/second in the bootloader.
;
; SUSPECTED CAUSE, NOT YET TESTED: `board_build.flash_size` on its own leaves
; `board_upload.flash_size` at the board def's 8MB, so build and upload disagree --
; a 16 MB partition table reaching 0x1000000 offered to a toolchain that still
; believes the flash is 8 MB. If 16 MB is ever wanted, set BOTH:
;     board_build.flash_size  = 16MB
;     board_upload.flash_size = 16MB
; and re-test. Not worth chasing for this project: the app is 281 KB.
;
; board_build.flash_size = 16MB
; board_build.flash_mode = qio

; DISABLED. Freenove's default_8MB.csv is what actually boots (see the 16 MB note
; above). Keep this file anyway -- a factory-app table with no otadata is the right
; shape for a build that will never do OTA -- but it must be paired with a matching
; `board_upload.flash_size` before it can be used.
; board_build.partitions = partitions_16mb.csv

; `memory_type` comes from the board def (qio_opi); it is not overridden here.
;
; WARNING FOR THE NEXT PERSON: an earlier version of this file claimed that
; memory_type "does NOT select the bootloader -- verified by hashing
; bootloader.bin before and after". THAT VERIFICATION WAS WORTHLESS. bootloader.bin
; is an SCons target whose only input is the bootloader .elf, so on an incremental
; build it is NEVER regenerated and its hash is stale no matter what you change.
; Clean the build dir -- or delete .pio/build/<env>/bootloader.bin -- before
; concluding anything from that hash. Even after a clean rebuild with a different
; board def AND `psram_type` set, the hash stayed at
; 75adf936bfc0b029ab5fdc6abde165cb, so it appears not to change -- but treat the
; mechanism as unproven too.
;
; CORRECTED 2026-10-11: this block used to claim "The app does not init PSRAM, which is
; why -DBOARD_HAS_PSRAM is absent." That is WRONG, and the mistake is worth keeping on
; the record because it made PSRAM look like a build flag someone had to remember.
;
; The flag is NOT set here because it does not need to be: the Freenove board def puts
; -DBOARD_HAS_PSRAM in its own `extra_flags`, alongside memory_type = qio_opi and
; psram_type = opi. So PSRAM is initialised by the core at boot with this file unchanged
; -- check the boot log for the PSRAM line, or os_get_free_heap. Nothing was ever
; "absent"; it was never needed.
;
; PSRAM is now USED, not merely available. The camera merged into this project on
; 2026-10-11, so frame buffers are allocated in PSRAM via config.fb_location, and
; the boot log's `psram:` line should show ~8 MB with a few MB free after init.
; GPIO33-37 stay reserved either way: they are bonded to the PSRAM die inside the
; module.

build_flags =
    ; *** BRING-UP SETTING: console on UART0, not USB. ***
    ; This carrier exposes exactly one USB serial path, and it is a USB-UART
    ; bridge wired to GPIO43/44 (U0TXD/U0RXD) -- confirmed by the ROM bootloader
    ; banner appearing on /dev/ttyACM0 at 115200. With USB_CDC_ON_BOOT=1 the
    ; application's Serial -- and the panic handler's backtrace -- go to the
    ; native USB instead, which has nothing plugged into it. That made a silent
    ; boot loop impossible to tell apart from a silent crash.
    ; -DARDUINO_USB_MODE=1 (set by the board) is still in force.
    ; Trade-off: UART0 is GPIO43/44, which is the link to the Pico (plan 2.3).
    ; That is fine while bringing up audio with no Pico wired; switch this back to
    ; -DARDUINO_USB_CDC_ON_BOOT=1 before the link is connected.
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; UNRESOLVED: this board does not boot ANY firmware, as of 2026-10-11.
;
; ESTABLISHED:
;   * Flashing works. esptool syncs, writes and verifies; a full chip erase works;
;     read_flash works. CPU, RAM, flash, clock and the ROM are all healthy.
;   * The ROM loads the second-stage bootloader and reports entry 0x403c98d0,
;     which is bootloader.bin's own entry point -- so the chip IS running the
;     bootloader we flashed, not a stale or corrupt one.
;   * ~10 ms later the bootloader resets the chip: `rst:0x3 (RTC_SW_SYS_RST)` with
;     an IDENTICAL `Saved PC` = 0x403cdb0a, an address inside the bootloader's own
;     code -- i.e. its failure-reset path. ~33 of those per second.
;   * No application output at all, with the console on UART0 or on USB. Only the
;     ROM banner repeats. Arduino's precompiled bootloader has logging compiled
;     out, so it fails in silence. The ROM banner is NOT evidence the app started.
;
; TRIED, AND NONE OF IT FIXED IT: full chip erase; a factory partition table with
; no otadata (kept anyway -- it is still the right table for a non-OTA build);
; memory_type = qio_opi; the Freenove board def (psram_type = opi); console on
; UART0 instead of USB; writing each shipped bootloader variant by hand.
;
; NEXT STEP: make the bootloader talk. Build this with `framework = espidf`
; (PlatformIO compiles the bootloader from source with IDF logging enabled) and
; read the reason. Nothing else so far has produced a usable message.
; ---------------------------------------------------------------------------

; With USB CDC on boot, `Serial` is the USB port, not UART0 -- which is what the
; plan wants (it keeps the UART pins free for the link to the Pico, and it means
; debug output never lands on a pin that is doing something else).
monitor_speed = 115200
upload_speed = 921600

; ---------------------------------------------------------------------------
; DIAGNOSTIC ENV -- bisecting distorted audio. NOT the default env.
;
;   pio run -d firmware/brain -e diag -t upload --upload-port /dev/ttyACM0
;
; It plays three beeps 2 s after boot and then EVERY 10 s, with NO radio and NO
; camera, so the tone can be judged with nothing else running and with no way to
; reach /play. That is the whole point: it makes "is the audio chain itself
; broken?" a separate question from "do the camera and the radio break it?"
; The LED flashes white in time with each beep, so the audio path can be confirmed
; visually as well as by ear.
;
; HOW TO BISECT, one variable at a time. Re-enable by deleting a line:
;   1. as-is            -> audio alone. Clean? then the chain is fine.
;   2. drop NO_CAMERA   -> + camera (PSRAM frame buffers allocated, no streaming)
;   3. drop NO_RADIO    -> + AP and web server (radio transmitting, page reachable)
;   4. drop BOOT_BEEP   -> back to production: silent until asked
;
; build_flags is repeated rather than inherited: `extends` would make
; ${env.build_flags} self-referential.
[env:diag]
extends = env:s3cam
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBRAIN_BOOT_BEEP=1
    -DBRAIN_NO_RADIO=1
    -DBRAIN_NO_CAMERA=1

; ---------------------------------------------------------------------------
; VOLUME SWEEP ENV -- the level-versus-distortion test. NOT the default env.
;
;   pio run -d firmware/brain -e sweep -t upload --upload-port /dev/ttyACM0
;
; No radio, no camera. Instead of a repeating beep it plays a CONTINUOUS 440 Hz
; tone at five amplitudes, 6 s each, looping forever:
;     0 (silence, the control)   0.00366   0.01   0.0366   0.10
;
; A continuous tone makes distortion far easier to judge than a 220 ms burst, and
; stepping the level answers the question that matters for a suspected power or
; headroom fault: DOES THE DISTORTION SCALE WITH LEVEL?
;
;   * bad only at the top steps      -> gain/headroom. Lower the digital level, or
;     better, attenuate in the ANALOGUE domain and keep the digital signal full
;     scale (the general rule -- every halving of digital amplitude costs a bit).
;   * bad at EVERY step, even 0.00366 -> it is not level at all. Then it is the
;     supply or the ground: plan section 12's bulk caps (470-1000 uF at the amp,
;     1000 uF low-ESR at the ESP32's 5 V pin) and the star ground are the fix.
;
; The step is announced on the serial console as it changes, so the answer can be
; "step 4 was the first bad one" rather than a guess.
[env:sweep]
extends = env:s3cam
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBRAIN_NO_RADIO=1
    -DBRAIN_NO_CAMERA=1
    -DBRAIN_VOLUME_SWEEP=1

; ---------------------------------------------------------------------------
; CONTINUOUS TONE ENV -- for PHYSICAL debugging. NOT the default env.
;
;   pio run -d firmware/brain -e tone -t upload --upload-port /dev/ttyACM0
;
; One steady 440 Hz tone at 0.010 (1 % FS, about -40 dBFS -- step 3 of the sweep),
; forever. That level is the one to use for cable-hunting: loud enough to hear
; clearly, quiet enough that flexing is not painful. It is also the level the
; sweep called clean, so anything you hear now is from the flex, not the level.
;
; Why CONTINUOUS and not a beep: a momentary break in a connection is a
; discontinuity, and a discontinuity in a steady tone is an instant click. With a
; 220 ms beep you would have to be lucky enough to flex at the same moment.
;
; Change the level with -DBRAIN_CONT_AMP_MILLI=<n> and the pitch with
; -DBRAIN_CONT_HZ=<hz>.
; The boot log now also names the RESET REASON, so a flex-induced brownout shows
; up as `reset : BROWNOUT` on the next line of the banner instead of passing for
; a healthy restart.
[env:tone]
extends = env:s3cam
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBRAIN_NO_RADIO=1
    -DBRAIN_NO_CAMERA=1
    -DBRAIN_CONT_TONE=1
    -DBRAIN_CONT_HZ=440
    -DBRAIN_CONT_AMP_MILLI=10
