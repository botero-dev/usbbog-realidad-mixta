; PlatformIO project — pico_body
; ---------------------------------------------------------------------------
; Board     : Raspberry Pi Pico (RP2040)
; Framework : Arduino-Pico (earlphilower core) — the Pico SDK underneath, so
;             hardware/pwm.h, hardware/uart.h and time_us_64() are all available
; Purpose   : the "body". Receives signed duties from the ESP32-S3 "brain" at
;             100 Hz and turns them into 4x 20 kHz PWM + 8 direction lines +
;             a shared STBY, with a 100 ms dead-man on STBY.
; Authority : docs/circuit-plan.md sections 3 (pin map), 3.1 (PWM maths),
;             4 (frame format), 9 (fail-safe), 10.2 (firmware notes).
;
; This is a STANDALONE project inside the repository, like network-test/.
; The root platformio.ini belongs to firmware/car_control, so build this one
; explicitly:
;
;   pio run -d firmware/pico_body                 # build
;   pio run -d firmware/pico_body -t upload       # flash over USB
;   pio run -d firmware/pico_body -t monitor      # USB CDC debug output
;
; First build downloads the raspberrypi platform + ARM toolchain (~300 MB).

[platformio]
; Default to the self-test so a fresh board does something observable without
; needing a second MCU. Switch to -DPICO_MODE_LINK once the link is wired.
default_envs = pico

[env:pico]
; The stock platformio/platform-raspberrypi ships ONLY the Mbed Arduino core
; (framework-arduino-mbed) and bundles no Pico SDK at all -- verified by
; inspecting its platform.json. This community fork of the same platform adds
; `framework = picosdk`, which is the bare SDK with no RTOS underneath.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = picosdk

; The picosdk integration compiles the SDK with SCons directly (no CMake) and
; defaults stdio to USB when nothing else is specified -- see the
; "defaulting to USB" branch in its builder/frameworks/picosdk.py. So printf()
; goes out of the USB port and claims no GPIO. That keeps UART0 (GP16/GP17)
; free for the link, and keeps GP0/GP1 -- which are DRV1_PWMA and DRV1_AIN1 --
; away from any console.
;
; build_src_flags rather than build_flags, because this builder compiles the
; whole SDK too and -Wall on SDK sources is just noise.
build_src_flags = -Wall -Wextra
build_flags =
    -DPICO_MODE_SELFTEST=1

; During bring-up, add this to build_flags so stdio waits for a USB host and the
; banner is never lost. It costs a stall at every boot, so leave it off for
; normal driving:
;   -DPICO_STDIO_USB_CONNECT_WAIT_TIMEOUT_MS=3000

monitor_speed = 115200

upload_protocol = picotool

; ---------------------------------------------------------------------------
; LINK mode -- the real job: parse frames from the S3 and drive the motors.
;
;   pio run -d firmware/pico_body -e picolink -t upload
;
; SELECTING IT IS DELIBERATE, and it is not the default. The self-test above is
; still load-bearing: bring-up step 4/5 (matching the printed FL/RL/RR/FR names
; to the actual wheels) is not closed, and it needs the sweep. A plain
; `pio run -t upload` must not silently replace the tool that closes it.
;
; The platform/board/framework lines are repeated rather than hoisted into a
; shared [env] section, so that the env above -- which is verified on hardware
; -- keeps exactly the configuration it was verified with.
;
; What differs is one flag. PICO_MODE_SELFTEST=0 selects the link path in
; src/main.cpp; everything else (GP16/GP17 at 921600, the 100 ms dead-man, the
; slew limit, the 10 Hz reply) is compiled in either way and lives in link.cpp.
[env:picolink]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = picosdk
build_src_flags = -Wall -Wextra
build_flags =
    -DPICO_MODE_SELFTEST=0

monitor_speed = 115200

upload_protocol = picotool
