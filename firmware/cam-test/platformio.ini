; PlatformIO project — cam-test (ESP32-S3 camera bring-up)
; ---------------------------------------------------------------------------
; Board     : Freenove ESP32-S3-WROOM N16R8 carrier (2 x 20 headers) + OV3660
; Framework : Arduino
; Purpose   : camera + SoftAP + MJPEG web stream, and NOTHING ELSE.
;
;             This is bring-up step 1 of docs/circuit-plan.md section 11
;             ("S3 alone: flash, USB CDC, camera capture, WiFi"), split out as its
;             own project so that a camera failure cannot be confused with an
;             audio failure. Both boards already have a standalone project for
;             this reason (pico_body/, network-test/).
;
; Authority : docs/circuit-plan.md sections 1, 2, 6, 10.1, 11
;             docs/esp32-cam.md section 9 (build settings for the N16R8 module)
;
; Build this one explicitly — the root platformio.ini belongs to car_control:
;
;   pio run -d firmware/cam-test              # build
;   pio run -d firmware/cam-test -t upload    # flash
;   pio run -d firmware/cam-test -t monitor   # serial
;
; Upload note: `pio device list` does NOT see this board (its WCH bridge,
; VID 1a86, is unknown to PlatformIO), so if auto-detection fails:
;   pio run -d firmware/cam-test -t upload --upload-port /dev/ttyACM0
; ---------------------------------------------------------------------------

[platformio]
default_envs = s3cam

[env:s3cam]
platform = espressif32
framework = arduino

; *** THIS BOARD, and no flash_size / partitions override. ***
;
; `freenove_esp32_s3_wroom` is the honest description of this carrier, and this
; exact combination is the one that BOOTS — see the long post-mortem in
; firmware/brain/platformio.ini, or /memories/repo/esp32-s3-boot-failure.md.
; `board_build.flash_size = 16MB` plus a 16 MB partition table put this board
; into a ~33 boot/second loop in the bootloader, every time, under two different
; board defs. Do not re-add either override here.
;
; WHY IT STILL FITS THE CAMERA:
;   * the def carries tools/partitions/default_8MB.csv, so app0 = 0x330000
;     (3.3 MB) — a camera + webserver app lands around 1.2 MB;
;   * the def already sets memory_type = qio_opi, psram_type = opi AND
;     -DBOARD_HAS_PSRAM in its extra_flags, so PSRAM is initialised by the core
;     without anything being added here. Frame buffers therefore land in PSRAM
;     (config.fb_location) with no build change.
; NB: the note in firmware/brain/platformio.ini claiming "-DBOARD_HAS_PSRAM is
; absent" is WRONG — the flag comes from the board def, not from build_flags.
board = freenove_esp32_s3_wroom

; No lib_deps: `esp32-camera` ships PREBUILT inside the installed core —
;   tools/sdk/esp32s3/include/esp32-camera/...   (headers)
;   tools/sdk/esp32s3/lib/libesp32-camera.a      (the library)
; so `#include "esp_camera.h"` links with no download. The reference
; implementation of the stream server is the core's own example, at
;   libraries/ESP32/examples/Camera/CameraWebServer/app_httpd.cpp
; (this project is a slimmed-down, commented version of that file).

build_flags =
    ; Console on UART0, not USB. This carrier exposes exactly ONE serial path and
    ; it is a USB-UART bridge (WCH 1a86:55d3) wired to GPIO43/44 — proven by the
    ; ROM banner appearing on /dev/ttyACM0 at 115200. With USB_CDC_ON_BOOT=1 the
    ; application's Serial goes to the native USB, which nothing is plugged into,
    ; and a silent crash becomes indistinguishable from a silent boot loop.
    ;
    ; TRADE-OFF: UART0 is GPIO43/44, which the plan reserves for the link to the
    ; Pico (plan 2.3). Harmless here — there is no Pico in this project — and
    ; this line must be flipped back to 1 before the link is ever wired.
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600
