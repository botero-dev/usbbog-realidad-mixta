; PlatformIO project configuration
; ---------------------------------
; Plataforma:  ESP32 Dev Module (Espressif)
; Framework:   Arduino
; Fuente:      carpeta firmware/car_control/ (main.cpp)
;
; Uso desde VS Code (extensión PlatformIO IDE):
;   Abre la carpeta raíz del repositorio -> barra inferior de PlatformIO:
;     [✓] Build  |  [→] Upload  |  [🔌] Serial Monitor
; También por terminal:  pio run -t upload ; pio device monitor

[platformio]
; Usa la carpeta del sketch (mismo layout que Arduino IDE)
src_dir = firmware/car_control

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad del monitor serie (debe coincidir con Serial.begin en el sketch)
monitor_speed = 115200

; Velocidad de subida por USB (115200 es compatible con el adaptador CP2102 en macOS)
upload_speed = 115200