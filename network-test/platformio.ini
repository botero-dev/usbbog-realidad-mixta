; PlatformIO project — network-test
; ---------------------------------------------------------------------------
; Board     : Heltec WiFi LoRa 32 (V3)   -> ESP32-S3, 8 MB flash, SX1262 radio,
;                                           onboard 0.96" SSD1306 OLED (I2C)
; Framework : Arduino
; Purpose   : sandbox for network / radio experiments. Currently it only drives
;             the onboard display: paints the panel with a colour whose
;             brightness glides through the hue wheel, forever.
;
; This is a STANDALONE project that lives *inside* the repository. The root
; platformio.ini belongs to firmware/car_control, so build this one explicitly:
;
;   pio run -d network-test                # build
;   pio run -d network-test -t upload      # flash over USB
;   pio device monitor -b 115200           # serial output
;
; In VS Code, either open the "network-test" folder itself, or open
; network-test.code-workspace (keeps PlatformIO IDE pointing at this file).

[env:heltec_wifi_lora_32_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

; Onboard OLED: SSD1306 128x64 over I2C. ArduinoJson parses the POST body.
lib_deps =
    olikraus/U8g2
    bblanchon/ArduinoJson

; Serial monitor speed — must match Serial.begin() in src/main.cpp.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The Heltec's CP2102 drives EN/IO0 from DTR/RTS. Leaving both lines low keeps
; the ESP32 running while the monitor is attached instead of holding it in
; reset (verified on hardware).
monitor_dtr = 0
monitor_rts = 0

; Upload: leave the board default (460800) — works with both the onboard
; USB-UART bridge and the ESP32-S3 native USB port.
build_flags =
    -DCORE_DEBUG_LEVEL=0
